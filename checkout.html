<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FashionHub | Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="container checkout-shell">
        <header class="topbar">
          <a class="brand" href="index.html">LUNORA</a>
          <a href="shop.html" class="link-more">Continue shopping</a>
        </header>

        <main class="checkout-layout">
          <section class="checkout-panel">
            <p class="eyebrow">Checkout</p>
            <h1>Secure your pieces</h1>

            <form class="checkout-form" role="form" aria-label="Checkout form">
              <div class="form-grid">
                <label>
                  <span>First name</span>
                  <input type="text" placeholder="Jane" />
                </label>
                <label>
                  <span>Last name</span>
                  <input type="text" placeholder="Smith" />
                </label>
              </div>

              <label>
                <span>Email</span>
                <input type="email" placeholder="jane@example.com" aria-required="true" />
              </label>

              <label>
                <span>Shipping address</span>
                <textarea rows="4" placeholder="123 Bloom Street, London"></textarea>
              </label>

              <div class="form-grid">
                <label>
                  <span>City</span>
                  <input type="text" placeholder="London" />
                </label>
                <label>
                  <span>Postal code</span>
                  <input type="text" placeholder="SW1A 1AA" />
                </label>
              </div>

              <fieldset class="payment-section">
                <legend>Payment</legend>
                <label>
                  <span>Name on card</span>
                  <input type="text" name="cardname" placeholder="Jane Smith" aria-required="true" />
                </label>

                <label>
                  <span>Card number</span>
                  <input type="text" name="cardnumber" placeholder="4242 4242 4242 4242" inputmode="numeric" aria-required="true" />
                </label>

                <div class="form-grid">
                  <label>
                    <span>Expiry (MM/YY)</span>
                    <input type="text" name="exp" placeholder="04/28" aria-required="true" />
                  </label>
                  <label>
                    <span>CVC</span>
                    <input type="text" name="cvc" placeholder="123" inputmode="numeric" aria-required="true" />
                  </label>
                </div>
              </fieldset>

              <button type="submit" class="btn btn-primary checkout-submit">Place order</button>
            </form>
          </section>

          <aside class="checkout-summary">
            <h2>Order summary</h2>
            <div id="summary-items"></div>
            <div class="summary-total">
              <span>Subtotal</span>
              <strong id="summary-subtotal">$0.00</strong>
            </div>
            <div class="summary-total">
              <span>Shipping</span>
              <strong id="summary-shipping">Free</strong>
            </div>
            <div class="summary-total grand-total">
              <span>Total</span>
              <strong id="summary-total">$0.00</strong>
            </div>
          </aside>
        </main>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const STORAGE_KEY = 'fashionhub-cart';
        const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);

        const loadCart = () => {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          } catch (e) {
            return [];
          }
        };

        const checkoutForm = document.querySelector('.checkout-form');
        const summaryItems = document.querySelector('#summary-items');
        const summarySubtotal = document.querySelector('#summary-subtotal');
        const summaryTotal = document.querySelector('#summary-total');

        const renderSummary = () => {
          const cart = loadCart();
          if (!cart.length) {
            summaryItems.innerHTML = '<div class="empty-cart">Your cart is empty.</div>';
            summarySubtotal.textContent = formatCurrency(0);
            summaryTotal.textContent = formatCurrency(0);
            return;
          }

          summaryItems.innerHTML = cart.map(item => `
            <div class="summary-item">
              <div>
                <strong>${item.name}</strong>
                <span>${item.quantity} item${item.quantity > 1 ? 's' : ''}</span>
              </div>
              <span>${formatCurrency(item.price * item.quantity)}</span>
            </div>
          `).join('');

          const subtotal = cart.reduce((s, it) => s + (it.price * it.quantity), 0);
          summarySubtotal.textContent = formatCurrency(subtotal);
          summaryTotal.textContent = formatCurrency(subtotal);
        };

        renderSummary();

        // Prefill subscriber email if available
        try {
          const storedEmail = localStorage.getItem('fashionhub-subscriber-email');
          if (storedEmail) {
            const emailInput = checkoutForm.querySelector('input[type="email"]');
            if (emailInput) emailInput.value = storedEmail;
          }
        } catch (e) {
          // ignore
        }

        // inline error helpers
        const showFieldError = (input, msg) => {
          if (!input) return;
          let err = input.parentElement.querySelector('.field-error');
          if (!err) {
            err = document.createElement('div');
            const id = `field-error-${Math.random().toString(36).slice(2,9)}`;
            err.id = id;
            err.className = 'field-error';
            input.parentElement.appendChild(err);
            input.setAttribute('aria-describedby', id);
          }
          err.textContent = msg;
          input.classList.add('invalid');
          input.focus();
        };

        const clearFieldErrors = () => {
          checkoutForm.querySelectorAll('.field-error').forEach(e => e.remove());
          checkoutForm.querySelectorAll('[aria-describedby]').forEach(i => i.removeAttribute('aria-describedby'));
          checkoutForm.querySelectorAll('.invalid').forEach(i => i.classList.remove('invalid'));
        };
        checkoutForm?.addEventListener('submit', (event) => {
          event.preventDefault();
          clearFieldErrors();
          // simple validation
          const emailInput = checkoutForm.querySelector('input[type="email"]');
          const email = emailInput.value.trim();
          if (!email) {
            showFieldError(emailInput, 'Please enter an email to continue.');
            return;
          }

          // payment fields validation (mock)
          const cardnumberInput = checkoutForm.querySelector('input[name="cardnumber"]');
          const cardnumber = cardnumberInput.value.replace(/\s+/g, '');
          const expInput = checkoutForm.querySelector('input[name="exp"]');
          const exp = expInput.value.trim();
          const cvcInput = checkoutForm.querySelector('input[name="cvc"]');
          const cvc = cvcInput.value.trim();
          const cardnameInput = checkoutForm.querySelector('input[name="cardname"]');
          const cardname = cardnameInput.value.trim();

          const luhn = (num) => {
            if (!/^[0-9]+$/.test(num)) return false;
            let sum = 0, alt = false;
            for (let i = num.length - 1; i >= 0; i--) {
              let n = parseInt(num.charAt(i), 10);
              if (alt) { n *= 2; if (n > 9) n -= 9; }
              sum += n; alt = !alt;
            }
            return sum % 10 === 0;
          };

          if (!luhn(cardnumber)) {
            showFieldError(cardnumberInput, 'Please enter a valid card number. For testing use 4242 4242 4242 4242');
            return;
          }

          const m = exp.match(/^(0[1-9]|1[0-2])\/(\d{2})$/);
          if (!m) {
            showFieldError(expInput, 'Expiry must be in MM/YY format');
            return;
          }
          const month = Number(m[1]);
          const year = Number('20' + m[2]);
          const now = new Date();
          const expDate = new Date(year, month - 1, 1);
          if (expDate < new Date(now.getFullYear(), now.getMonth(), 1)) {
            showFieldError(expInput, 'Card expiry must be in the future');
            return;
          }

          if (!/^[0-9]{3,4}$/.test(cvc)) {
            showFieldError(cvcInput, 'CVC must be 3 or 4 digits');
            return;
          }

          // Create a fake order id and store order in sessionStorage for confirmation page
          const orderId = `ORD-${Date.now().toString(36).toUpperCase()}`;
          const order = {
            id: orderId,
            date: new Date().toISOString(),
            customer: {
              firstName: checkoutForm.querySelector('input[placeholder="Jane"]').value || '',
              lastName: checkoutForm.querySelector('input[placeholder="Smith"]').value || '',
              email,
              address: checkoutForm.querySelector('textarea').value || ''
            },
            payment: {
              method: 'card',
              cardLast4: cardnumber.slice(-4),
              cardName: cardname || ''
            },
            items: loadCart()
          };

          // persist order in localStorage for admin view
          try {
            const existing = JSON.parse(localStorage.getItem('fashionhub-orders') || '[]');
            existing.push(order);
            localStorage.setItem('fashionhub-orders', JSON.stringify(existing));
          } catch (e) {
            // ignore
          }

          sessionStorage.setItem('fashionhub-last-order', JSON.stringify(order));
          localStorage.removeItem(STORAGE_KEY);
          window.location.href = 'order-success.html';
        });
      });
    </script>
  </body>
</html>
